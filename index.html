<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedMo | Unified GovCon Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for reading the CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-300 font-sans min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-bold text-white">FM</div>
            <h1 class="text-xl font-bold text-white tracking-wide">FedMo <span class="text-slate-500 text-sm font-normal">MVP</span></h1>
        </div>
        <div class="text-sm">
            <span id="opp-count" class="bg-blue-900/50 text-blue-400 py-1 px-3 rounded-full font-medium">Loading opportunities...</span>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="p-6 max-w-7xl mx-auto flex flex-col md:flex-row gap-6">
        
        <!-- Sidebar Controls -->
        <aside class="w-full md:w-1/3 lg:w-1/4 space-y-6">
            <div class="bg-slate-800 p-5 rounded-lg border border-slate-700">
                <h2 class="text-white font-semibold mb-4">Discovery Filters</h2>
                
                <!-- Search Box -->
                <div class="mb-4">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Search Keywords</label>
                    <input type="text" id="search-box" placeholder="e.g., Custodial, Airboat..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <!-- Set Aside Filter -->
                <div class="mb-4">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Set-Aside Type</label>
                    <select id="set-aside-filter" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="">All Set-Asides</option>
                        <!-- Options populated via JS -->
                    </select>
                </div>
                
                <button id="clear-filters" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-sm py-2 rounded transition">
                    Clear Filters
                </button>
            </div>
        </aside>

        <!-- Opportunity Feed (Pipeline) -->
        <section class="w-full md:w-2/3 lg:w-3/4">
            <div id="loading-state" class="text-center py-12">
                <p class="text-slate-500">Parsing SAM.gov dataset...</p>
            </div>
            
            <div id="opportunity-feed" class="space-y-4 hidden">
                <!-- Cards injected here via JavaScript -->
            </div>
        </section>
    </main>

    <script>
        let allOpportunities = [];

        // 1. Fetch and Parse the CSV File
        Papa.parse("active_solicitations_next_30_days.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                allOpportunities = results.data;
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('opportunity-feed').classList.remove('hidden');
                
                populateFilters(allOpportunities);
                renderFeed(allOpportunities);
            },
            error: function(err) {
                document.getElementById('loading-state').innerHTML = `<p class="text-red-400">Error loading CSV. Make sure the file is named correctly and hosted in the same directory.</p>`;
            }
        });

        // 2. Render the Opportunity Cards
        function renderFeed(data) {
            const feed = document.getElementById('opportunity-feed');
            feed.innerHTML = '';
            
            document.getElementById('opp-count').innerText = `${data.length} Active Bids`;

            if (data.length === 0) {
                feed.innerHTML = `<div class="bg-slate-800 p-8 rounded-lg border border-slate-700 text-center"><p class="text-slate-400">No opportunities match your filters.</p></div>`;
                return;
            }

            // Only render top 50 to keep the browser fast
            const displayData = data.slice(0, 50);

            displayData.forEach(opp => {
                // Formatting dates and handling empty data safely
                const dueDate = opp['Current Response Date'] ? opp['Current Response Date'].split(' ')[0] : 'TBD';
                const setAside = opp['Current Set Aside'] || 'Unrestricted';
                const naics = opp['NAICS'] || 'N/A';
                
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-5 rounded-lg border border-slate-700 hover:border-slate-500 transition group relative";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-xs font-bold text-blue-400 tracking-wider uppercase mb-1 block">${opp['Contracting Office'] || 'Federal Agency'}</span>
                            <h3 class="text-lg font-bold text-white leading-tight pr-4">${opp['Opportunity Title']}</h3>
                        </div>
                        <div class="text-right whitespace-nowrap">
                            <div class="text-xs text-slate-400 mb-1">Due Date</div>
                            <div class="font-bold text-red-400">${dueDate}</div>
                        </div>
                    </div>
                    
                    <p class="text-sm text-slate-400 mt-3 mb-4 line-clamp-2">${opp['Description'] || 'No description provided.'}</p>
                    
                    <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-slate-700">
                        <span class="bg-slate-900 px-2 py-1 rounded text-xs text-slate-300 border border-slate-700"><b>Notice ID:</b> ${opp['Notice ID']}</span>
                        <span class="bg-slate-900 px-2 py-1 rounded text-xs text-slate-300 border border-slate-700"><b>Set Aside:</b> ${setAside}</span>
                        <span class="bg-slate-900 px-2 py-1 rounded text-xs text-slate-300 border border-slate-700"><b>NAICS:</b> ${naics}</span>
                    </div>

                    <div class="mt-4 flex gap-3">
                        <a href="https://sam.gov/opp/${opp['Notice ID']}/view" target="_blank" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded transition">
                            View on SAM.gov
                        </a>
                        ${opp['POC Email'] ? `<a href="mailto:${opp['POC Email']}?subject=Inquiry regarding ${opp['Notice ID']}" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded transition">Email POC</a>` : ''}
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        // 3. Extract unique filters from the data
        function populateFilters(data) {
            const setAsides = new Set();
            data.forEach(opp => {
                if (opp['Current Set Aside']) setAsides.add(opp['Current Set Aside']);
            });

            const filterDropdown = document.getElementById('set-aside-filter');
            Array.from(setAsides).sort().forEach(sa => {
                const option = document.createElement('option');
                option.value = sa;
                option.innerText = sa;
                filterDropdown.appendChild(option);
            });
        }

        // 4. Handle Search and Filtering Logic
        function applyFilters() {
            const searchTerm = document.getElementById('search-box').value.toLowerCase();
            const selectedSetAside = document.getElementById('set-aside-filter').value;

            const filteredData = allOpportunities.filter(opp => {
                const matchesSearch = 
                    (opp['Opportunity Title'] && opp['Opportunity Title'].toLowerCase().includes(searchTerm)) ||
                    (opp['Description'] && opp['Description'].toLowerCase().includes(searchTerm)) ||
                    (opp['NAICS'] && opp['NAICS'].toLowerCase().includes(searchTerm));
                
                const matchesSetAside = selectedSetAside === "" || opp['Current Set Aside'] === selectedSetAside;

                return matchesSearch && matchesSetAside;
            });

            renderFeed(filteredData);
        }

        // Event Listeners
        document.getElementById('search-box').addEventListener('input', applyFilters);
        document.getElementById('set-aside-filter').addEventListener('change', applyFilters);
        
        document.getElementById('clear-filters').addEventListener('click', () => {
            document.getElementById('search-box').value = '';
            document.getElementById('set-aside-filter').value = '';
            renderFeed(allOpportunities);
        });
    </script>
</body>
</html>
